<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/banner.png" />
    <!-- PWA: 안드로이드 등에서 "앱 설치/홈 화면에 추가" (HTTPS 또는 localhost 에서만 설치 가능) -->
    <link rel="manifest" href="/stage.webmanifest" />
    <meta name="theme-color" content="#0e1626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stage" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Cardinal Stage</title>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel" class="st-panel">
      <div class="st-head">
        <span id="status-dot" class="dot off"></span>
        <span id="status-text">연결 중…</span>
        <span class="st-spacer"></span>
        <a id="chat-link" href="/">카디널</a>
      </div>
      <div id="log" class="st-log"></div>
      <label class="st-check" title="끄면 스테이지에서 보낸 말의 답만 읽음. 켜면 다른 곳(웹 대화 탭, 채널)에서 시킨 일의 답도 읽음">
        <input id="read-all" type="checkbox" /> 다른 곳 대화도 읽기
      </label>
    </div>
    <form id="say" class="st-say">
      <div id="mic" class="st-mic"></div>
      <textarea id="say-text" rows="1" placeholder="관리자에게 말하기 (Enter 보내기, Shift+Enter 줄바꿈)"></textarea>
      <button type="submit">보내기</button>
      <button id="stop" type="button" class="ghost" title="말풍선 멈추고 관리자 턴 중단">중단</button>
    </form>
    <div id="echo" class="st-echo" aria-live="polite"></div>
    <script type="module" src="/src/stage-page/main.ts"></script>
  </body>
</html>
