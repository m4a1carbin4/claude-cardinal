<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cardinal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
<style>
  :root {
    --bg: #15131a; --panel: #1d1a24; --line: #2c2836; --text: #e6e1ee; --dim: #8e869c; --accent: #c8a46b;
    --idle: #6bbf8a; --busy: #d9a441; --waiting: #e0675f; --starting: #7a9bd9; --ended: #5c5666;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 260px 1fr; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600; color: var(--accent); }
  #list { flex: 1; overflow: auto; }
  .s { padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .s:hover { background: #24202d; }
  .s.on { background: #2a2534; }
  .s .top { display: flex; align-items: center; gap: 8px; }
  .s .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .s .role { color: var(--dim); font-size: 11px; }
  .s .sub { color: var(--dim); font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  form { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #bar { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; color: var(--dim); }
  #bar .title { color: var(--text); font-weight: 600; }
  #bar .sp { flex: 1; }
  #term { flex: 1; min-height: 0; padding: 6px; }
  .empty { margin: auto; color: var(--dim); }
</style>
</head>
<body>
<aside>
  <header>Cardinal</header>
  <div id="list"></div>
  <form id="create">
    <input name="name" placeholder="세션 이름" required pattern="[A-Za-z0-9][A-Za-z0-9_\-]*" />
    <select name="role"><option value="worker">worker</option><option value="master">master</option></select>
    <input name="cwd" placeholder="작업 폴더 (절대 경로, 비우면 기본)" />
    <label><input type="checkbox" name="trust" /> 처음 쓰는 폴더면 신뢰 자동 수락</label>
    <details><summary>채널 라우트 (선택)</summary>
      <div style="display:grid;gap:6px;margin-top:6px">
        <select name="platform"><option value="*">모든 채널</option><option value="discord">discord</option><option value="local">local</option></select>
        <input name="channel" placeholder="채널 이름/ID (비우면 아무 채널)" />
        <input name="trigger" placeholder="트리거 (예: !ask, 비우면 모든 메시지)" />
        <select name="match"><option value="prefix">prefix</option><option value="contains">contains</option><option value="regex">regex</option><option value="mention">@멘션</option></select>
        <label><input type="checkbox" name="auto_reply" /> 턴 끝나면 자동 답장</label>
      </div>
    </details>
    <button>새 세션</button>
  </form>
</aside>
<main>
  <div id="bar"><span class="title" id="cur">세션 선택</span><span id="curState"></span><span class="sp"></span>
    <label><input type="checkbox" id="ro" /> 관전 모드</label>
    <button id="kill" hidden>종료</button>
  </div>
  <div id="term"><div class="empty">왼쪽에서 세션을 고르면 터미널이 붙음</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
  const token = new URLSearchParams(location.search).get('token');
  const q = (extra = {}) => { const p = new URLSearchParams(extra); if (token) p.set('token', token); const s = p.toString(); return s ? '?' + s : ''; };
  const wsBase = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  const api = (path, opts = {}) => fetch('/api' + path + q(), { headers: { 'content-type': 'application/json' }, ...opts })
    .then(async r => { const b = await r.json(); if (!r.ok) throw new Error(typeof b.detail === 'string' ? b.detail : JSON.stringify(b.detail)); return b; });

  const $ = id => document.getElementById(id);
  let sessions = [], current = null, term = null, fit = null, sock = null;

  // ---- 세션 목록 (상태 이벤트 웹소켓) ----
  function render() {
    $('list').innerHTML = '';
    for (const s of sessions) {
      const el = document.createElement('div');
      el.className = 's' + (s.name === current ? ' on' : '');
      el.innerHTML = `<div class="top"><span class="dot" style="background:var(--${s.state})"></span>
        <span class="name"></span><span class="role">${s.role}</span></div><div class="sub"></div>`;
      el.querySelector('.name').textContent = s.name;
      el.querySelector('.sub').textContent = s.state + (s.state === 'busy' && s.tool ? ' · ' + s.tool : '') + (s.detail ? ' · ' + s.detail : '');
      el.onclick = () => open(s.name);
      $('list').appendChild(el);
    }
    const cur = sessions.find(s => s.name === current);
    $('curState').textContent = cur ? `· ${cur.state}` : '';
  }
  function connectEvents() {
    const ws = new WebSocket(wsBase + '/ws/events' + q());
    ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'sessions') { sessions = m.sessions; render(); } };
    ws.onclose = () => setTimeout(connectEvents, 1500);
  }

  // ---- 터미널 (터미널 웹소켓) ----
  function open(name) {
    current = name; render();
    $('cur').textContent = name; $('kill').hidden = false;
    if (sock) sock.close();
    if (!term) {
      $('term').innerHTML = '';
      term = new Terminal({ fontSize: 13, cursorBlink: true, theme: { background: '#15131a' }, fontFamily: 'ui-monospace, Menlo, monospace' });
      fit = new FitAddon.FitAddon(); term.loadAddon(fit);
      term.open($('term'));
      term.onData(d => sock?.readyState === 1 && sock.send(JSON.stringify({ t: 'i', d })));
      term.onResize(({ cols, rows }) => sock?.readyState === 1 && sock.send(JSON.stringify({ t: 'r', c: cols, r: rows })));
      new ResizeObserver(() => fit.fit()).observe($('term'));
    }
    term.reset(); fit.fit();
    const params = { cols: term.cols, rows: term.rows };
    if ($('ro').checked) params.readonly = '1';
    const ws = sock = new WebSocket(wsBase + '/ws/term/' + encodeURIComponent(name) + q(params));
    ws.binaryType = 'arraybuffer';
    ws.onmessage = e => term.write(new Uint8Array(e.data));
    ws.onclose = e => { if (sock === ws) term.write(`\r\n\x1b[2m[연결 끊김: ${e.reason || e.code}]\x1b[0m\r\n`); };
    term.focus();
  }
  $('ro').onchange = () => current && open(current);

  $('create').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      const body = { name: f.get('name'), role: f.get('role'), routes: [],
                     cwd: f.get('cwd') || undefined, trust: f.get('trust') === 'on' };
      if (f.get('channel') || f.get('trigger') || f.get('match') === 'mention' || f.get('platform') !== '*')
        body.routes.push({ platform: f.get('platform'), channel: f.get('channel') || null, trigger: f.get('trigger') || null,
                           match: f.get('match'), auto_reply: f.get('auto_reply') === 'on' });
      await api('/sessions', { method: 'POST', body: JSON.stringify(body) });
      e.target.reset();
      open(f.get('name'));
    } catch (err) { alert(err.message); }
  };
  $('kill').onclick = async () => {
    if (!current || !confirm(`${current} 종료?`)) return;
    try { await api('/sessions/' + encodeURIComponent(current), { method: 'DELETE' }); } catch (err) { alert(err.message); }
  };

  connectEvents();
</script>
</body>
</html>
