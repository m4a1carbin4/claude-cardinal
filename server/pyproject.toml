[project]
name = "cardinal-server"
version = "0.1.0"
description = "Cardinal server: session DB, web terminal, message channel (Discord, Slack)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "discord.py>=2.4",
    "ptyprocess>=0.7",
    "watchfiles>=0.24",
    "claude-agent-sdk>=0.2.170",
    "slack-sdk>=3.33",
]

[project.scripts]
cardinal-server = "cardinal_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardinal_server"]
